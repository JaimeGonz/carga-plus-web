<script>

  // IMPORTANT: "FASE 1 — BACKEND" content/order below is UNCHANGED from

      weeks: [
        {
          title: "Program de 3 estados + adaptar Routine",
          dates: "2 — 3 Sep",
          program: true,
          days: [
            { date: "Mié 2 Sep", focus: "Diseño del modelo Program", tasks: [

              "Agregar dayOfWeek a Routine, quitar isActive y weeklyFrequency",
              "Agregar enum SetType a WorkoutSet (NORMAL/WARMUP/DROPSET/FAILURE/OTHER)",
              "Migrar schema y actualizar seed.ts (Program + dayOfWeek en las 5 rutinas)",
            ]},
            { date: "Mié 2 Sep (cont.)", focus: "ProgramsModule — CRUD base", tasks: [
              "CreateProgramDto + UpdateProgramDto",
              "ProgramsRepository: create, findOne, findAll (con filtro de archivados)",

            { date: "Jue 3 Sep", focus: "Adaptar RoutinesModule a Program", tasks: [
              "Quitar weeklyFrequency de CreateRoutineDto, agregar dayOfWeek",
              "RoutinesRepository/Service: recibir programId, verificar contra ProgramsService",

    },
    {
      phase: "FASE 1.5 — SITIO PERSONAL (PORTFOLIO)",
      portfolio: true,
      weeks: [
        {

          dates: "17 — 19 Sep",
          portfolio: true,
          days: [
            { date: "Jue 17 Sep", focus: "Planeación + setup", tasks: [

            ]},
            { date: "Sáb 19 Sep", focus: "Pulido y publicación 🎉", tasks: [

              "Deploy final + actualizar link en GitHub bio, LinkedIn y CV",
            ]},
          ]
        },
      ]
    },
    {
      phase: "FASE 2 — FRONTEND",
      weeks: [
        {
          title: "Setup + Autenticación",
          dates: "21 — 27 Sep",
          days: [
            { date: "Lun 21 Sep", focus: "Setup del proyecto", tasks: [
              "Crear proyecto Next.js + Tailwind",
              "Estructura de carpetas (app/, components/, lib/)",
            ]},
            { date: "Mar 22 Sep", focus: "Login", tasks: [
              "Página de login conectada a POST /auth/login",
              "Guardar JWT (cookie o storage) tras login exitoso",
            ]},
            { date: "Mié 23 Sep", focus: "Registro + rutas protegidas", tasks: [
              "Página de registro",
              "Middleware/guard de rutas protegidas en el frontend",
            ]},
            { date: "Jue 24 Sep", focus: "Layout base", tasks: [
              "Navbar/sidebar + botón de logout",

            { date: "Sáb 26 Sep", focus: "Cierre", tasks: [
              "Commit + push — Auth del frontend funcionando end-to-end",
            ]},
            { rest: true, date: "Dom 27 Sep" },
          ]
        },
        {
          title: "Rutinas y sesión de entrenamiento",
          dates: "28 Sep — 4 Oct",
          days: [
            { date: "Lun 28 Sep", focus: "Listado de rutinas", tasks: [
              "Página que consume GET /routines y las muestra en tarjetas",
            ]},
            { date: "Mar 29 Sep", focus: "Crear rutina", tasks: [
              "Formulario de creación con ejercicios anidados (agregar/quitar)",
            ]},
            { date: "Mié 30 Sep", focus: "Detalle y edición", tasks: [
              "Página de detalle de rutina",
              "Edición de rutina existente",
            ]},
            { date: "Jue 1 Oct", focus: "Iniciar sesión", tasks: [

          ]
        },
        {
          title: "Dashboard + Deploy + MVP terminado",
          dates: "5 — 10 Oct",
          days: [
            { date: "Lun 5 Oct", focus: "Dashboard básico", tasks: [
              "Resumen de actividad reciente",
              "Últimas sesiones registradas",
            ]},
            { date: "Mar 6 Oct", focus: "Historial", tasks: [
              "Listado completo de sesiones pasadas con filtros simples",
            ]},
            { date: "Mié 7 Oct", focus: "Pulido visual", tasks: [
              "Revisar responsive (mobile) en todas las pantallas",
              "Consistencia de estilos con Tailwind",
            ]},
            { date: "Jue 8 Oct", focus: "Deploy frontend", tasks: [
              "Deploy a Vercel + variables de entorno de producción",
            ]},
            { date: "Vie 9 Oct", focus: "Testing end-to-end", tasks: [
              "Probar flujo completo real: registro → login → crear rutina → sesión → dashboard",
            ]},
            { date: "Sáb 10 Oct", focus: "MVP TERMINADO 🎉", tasks: [
              "README general del proyecto",
              "Grabar GIF/demo corto para el portafolio",
              "Carga+ listo para mostrar en entrevistas",
            ]},
          ]
        },
      ]
    }
  ];

  // Flatten and assign stable IDs (position-based, in array order —
  // Fase 1 Backend ids are unchanged vs. previous roadmap versions)
  let taskCounter = 0;
  let dayCounter = 0;
  PLAN.forEach(phase => {
    phase.weeks.forEach(week => {
      week.days.forEach(day => {
        day.id = "day-" + (dayCounter++);
        if (!day.rest) {
          day.taskIds = day.tasks.map(() => "task-" + (taskCounter++));
        }
      });
    });
  });

  const root = document.getElementById("app-root");
  let state = {};
  let openWeeks = new Set();
  let loaded = false;

  async function loadState() {
    try {
      const result = await window.storage.get(STORAGE_KEY, false);
      state = result && result.value ? JSON.parse(result.value) : {};
    } catch (e) {
      state = {};
    }
    loaded = true;
    outer: for (const phase of PLAN) {
      for (const week of phase.weeks) {
        for (const day of week.days) {
          if (day.rest) continue;
          const allDone = day.taskIds.every(id => state[id]);
          if (!allDone) {
            openWeeks.add(phase.phase + "|" + week.title);
            break outer;
          }
        }
      }
    }
    render();
  }

  async function saveState() {
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), false);
    } catch (e) {
      console.error("No se pudo guardar el progreso", e);
    }
  }

  function toggleTask(taskId) {
    state[taskId] = !state[taskId];
    saveState();
    render();
  }

  function toggleWeek(key) {
    if (openWeeks.has(key)) openWeeks.delete(key);
    else openWeeks.add(key);
    render();
  }

  async function resetProgress() {
    if (!confirm("¿Seguro que quieres reiniciar todo el progreso del roadmap?")) return;
    state = {};
    await saveState();
    render();
  }

  function countTasks() {
    let total = 0, done = 0;
    PLAN.forEach(phase => phase.weeks.forEach(week => week.days.forEach(day => {
      if (day.rest) return;
      day.taskIds.forEach(id => {
        total++;
        if (state[id]) done++;
      });
    })));
    return { total, done };
  }

  function countWeekTasks(week) {
    let total = 0, done = 0;
    week.days.forEach(day => {
      if (day.rest) return;
      day.taskIds.forEach(id => {
        total++;
        if (state[id]) done++;
      });
    });
    return { total, done };
  }

  function render() {
    if (!loaded) {
      root.innerHTML = '<div class="loading-state">Cargando tu progreso…</div>';
      return;
    }

    const { total, done } = countTasks();
    const pct = total ? Math.round((done / total) * 100) : 0;

    let html = `
      <div class="header">
        <div class="header-eyebrow">Roadmap de proyecto</div>
        <div class="header-title">Carga+ — Plan hasta el MVP</div>
        <div class="header-sub">28 Ago → 10 Oct 2026 · ~3-4 hrs/día · domingos de descanso</div>
        <div class="progress-block">
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="progress-label">${done}/${total}</div>
        </div>
        <div class="stats-row">
          <div class="stat-chip">Backend: <b>Routines → Sessions → Sets → Deploy</b></div>
          <div class="stat-chip">Programs: <b>3 estados (2-3 sep)</b></div>
          <div class="stat-chip">Portfolio: <b>sitio personal (17-19 sep)</b></div>
          <div class="stat-chip">Frontend: <b>Auth → Rutinas → Sesión → Dashboard</b></div>
        </div>
      </div>
      <div class="body-scroll">
    `;

    PLAN.forEach(phase => {
      const phaseClass = phase.portfolio ? 'portfolio' : (phase.program ? 'program' : '');
      html += `
        <div class="phase-divider ${phaseClass}">
          <div class="dot"></div>
          <div class="label">${phase.phase}</div>
          <div class="line"></div>
        </div>
      `;

      phase.weeks.forEach(week => {
        const key = phase.phase + "|" + week.title;
        const isOpen = openWeeks.has(key);
        const { total: wt, done: wd } = countWeekTasks(week);
        const weekClass = week.portfolio ? 'portfolio' : (week.program ? 'program' : '');

        html += `<div class="week-block ${weekClass}">
          <div class="week-head" data-week="${key}">
            <div class="week-head-left">
              <span class="chevron ${isOpen ? "open" : ""}">▸</span>
              <div>
                <div class="week-title">${week.title}</div>
                <div class="week-dates">${week.dates}</div>
              </div>
            </div>
            <div class="week-progress-mini">${wd}/${wt} ${wd === wt ? "✅" : ""}</div>
          </div>
        `;

        if (isOpen) {
          html += `<div class="week-days">`;
          week.days.forEach(day => {
            if (day.rest) {
              html += `<div class="day-row rest">
                <div class="day-head">
                  <span class="day-date">${day.date}</span>
                  <span class="rest-tag">Descanso</span>
                </div>
              </div>`;
            } else {
              const allDone = day.taskIds.every(id => state[id]);
              html += `<div class="day-row ${allDone ? "complete" : ""}">
                <div class="day-head">
                  <span class="day-date">${day.date}</span>
                  <span class="day-focus">${day.focus}</span>
                  ${allDone ? '<span style="margin-left:auto;font-size:11px;">✅</span>' : ""}
                </div>
                <div class="task-list">
              `;
              day.tasks.forEach((t, i) => {
                const id = day.taskIds[i];
                const checked = !!state[id];
                html += `
                  <div class="task-item" data-task="${id}">
                    <div class="checkbox ${checked ? "checked" : ""}">
                      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    </div>
                    <div class="task-text ${checked ? "checked" : ""}">${t}</div>
                  </div>
                `;
              });
              html += `</div></div>`;
            }
          });
          html += `</div>`;
        }

        html += `</div>`;
      });
    });

    html += `
      </div>
      <div class="footer-note">
        Tu progreso se guarda automáticamente. Si un día no llegas a las 3-4 horas completas, no pasa nada — marca lo que sí lograste y sigue mañana. Lo importante es no perder más de 1-2 días seguidos sin avanzar.
        <br/>
        <button class="reset-btn" id="reset-btn">Reiniciar progreso</button>
      </div>
    `;

    root.innerHTML = html;

    root.querySelectorAll(".week-head").forEach(el => {
      el.addEventListener("click", () => toggleWeek(el.dataset.week));
    });
    root.querySelectorAll(".task-item").forEach(el => {
      el.addEventListener("click", () => toggleTask(el.dataset.task));
    });
    const resetBtn = document.getElementById("reset-btn");
    if (resetBtn) resetBtn.addEventListener("click", resetProgress);
  }

  loadState();
})();
</script>
